# Roda os testes automáticos a cada alteração enviada ao GitHub (aparece um ✔ verde ou ✖ vermelho no repositório).
name: Testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
